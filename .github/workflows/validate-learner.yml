name: Validate learner file

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate learner file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check the learner file
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          python3 - <<'PYCODE'
          import os
          import re
          import subprocess
          from pathlib import Path

          author = os.environ['PR_AUTHOR']
          if not re.fullmatch(r'[A-Za-z0-9-]{1,39}', author):
              raise SystemExit('Invalid GitHub login')
          expected = f'learners/{author}.md'
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', '-z', 'HEAD^1', 'HEAD^2']
          ).decode().rstrip('\0').split('\0')
          if changed != [expected]:
              raise SystemExit(f'This pull request must change only {expected}')
          path = Path(expected)
          content = path.read_bytes()
          if len(content) >= 2048:
              raise SystemExit('The learner file must be under 2 KB')
          text = content.decode('utf-8')
          headings = [line.strip() for line in text.splitlines() if line.startswith('#')]
          required = ['# Name', '## One thing I want to learn', '## Favourite tool']
          if headings != required:
              raise SystemExit('Use the three template headings in order')
          sections = re.split(r'(?m)^#{1,2} .+\n', text)
          if len(sections) != 4 or any(not section.strip() for section in sections[1:]):
              raise SystemExit('Write a short answer under each heading')
          PYCODE
